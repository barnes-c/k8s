apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager-webhook-porkbun
  namespace: argocd
  # Wave 0, not -1: the webhook's own serving certificate is a cert-manager Certificate,
  # so cert-manager's CRDs must already exist. Same wave as cert-manager-config, whose
  # ClusterIssuer points at this solver -- issuance simply retries until the APIService
  # comes up.
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/barnes-c/homelab
    targetRevision: master
    path: manifests/cert-manager-webhook-porkbun
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
